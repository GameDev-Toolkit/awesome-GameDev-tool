name: tmp-report
on: push
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        run: |
          python3 scripts/check_links.py --jobs 32 --timeout 30 --retries 3 --recheck \
            --report report.md --json report.json || true
          mkdir -p reports && cp report.md report.json reports/
      - name: Publish
        run: |
          git config user.name "link-bot"
          git config user.email "link-bot@users.noreply.github.com"
          git checkout --orphan arena/link-report
          git rm -rf --cached . >/dev/null
          git add -f reports
          git commit -q -m "chore: link report"
          git push -f origin HEAD:refs/heads/arena/link-report
