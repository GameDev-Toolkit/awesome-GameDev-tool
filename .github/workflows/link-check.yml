name: link-check

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC — catches sites that quietly disappeared.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check every link
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links
        run: |
          python3 scripts/check_links.py \
            --jobs 32 \
            --timeout 30 \
            --retries 3 \
            --recheck \
            --report link-report.md \
            --json link-report.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f link-report.md ]; then
            cat link-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: |
            link-report.md
            link-report.json
          if-no-files-found: ignore
          retention-days: 30
